name: Evaluator platform verification

# The native evaluator on Linux and Windows, which cannot be run on the macOS machines that build releases: on
# changes to the native code, and on request
on:
  push:
    branches: [main]
    paths: ['Native/**', '.github/workflows/evaluator-verification.yml']
  pull_request:
    paths: ['Native/**', '.github/workflows/evaluator-verification.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headers:
    name: Prepare LibraryLink headers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Extract headers from the official Wolfram Engine image
        shell: bash
        run: |
          set -euo pipefail
          image=wolframresearch/wolframengine:15.0@sha256:3ac08d6aaa33e6dccdda38d14cf8a7e5c22cc84d037a1a7562900914a487ef65
          docker pull "$image"
          container=$(docker create "$image")
          trap 'docker rm "$container"' EXIT
          mkdir -p headers
          docker cp "$container:/usr/local/Wolfram/WolframEngine/15.0/SystemFiles/IncludeFiles/C/." headers/
          test -f headers/WolframLibrary.h
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: librarylink-headers
          path: headers/
          retention-days: 3

  native:
    name: Native evaluator (${{ matrix.os }})
    needs: headers
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: librarylink-headers
          path: ${{ runner.temp }}/librarylink-headers
      - name: Install memory monitor
        run: python -m pip install psutil==7.2.2
      - name: Build and test the native bridge
        env:
          LEANLINK_WL_HEADERS: ${{ runner.temp }}/librarylink-headers
        run: python Native/shim/verification/run.py
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: evaluator-${{ matrix.os }}
          path: verification-results/
          if-no-files-found: warn
          retention-days: 30
